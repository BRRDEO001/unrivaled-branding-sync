# Archives ACTIVE products whose variant SKUs never appear on any Amrod /Prices/ row
# that resolves through variant-map.json (same rules as price-apply-bulk). Matches
# “pricing sync couldn’t target this product”, not “Shopify price is $0”.
name: Shopify — Archive products without pricing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only list products that would be archived (no changes)."
        required: true
        default: true
        type: boolean
      max_products:
        description: "Stop after this many archives (0 = no limit). Applies per run."
        required: false
        default: "0"

jobs:
  archive-unpriced:
    runs-on: ubuntu-latest
    environment: synced
    timeout-minutes: 360

    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      SHOPIFY_API_VERSION: "2026-01"
      AMROD_USERNAME: ${{ secrets.AMROD_USERNAME }}
      AMROD_PASSWORD: ${{ secrets.AMROD_PASSWORD }}
      AMROD_CUSTOMER_CODE: ${{ secrets.AMROD_CUSTOMER_CODE }}
      ARCHIVE_DRY_RUN: ${{ inputs.dry_run }}
      ARCHIVE_MAX_PRODUCTS: ${{ inputs.max_products }}
      ARCHIVE_DELAY_MS: "400"
      PRODUCTS_PAGE_SIZE: "50"
      VARIANT_MAP_JSON: ${{ github.workspace }}/price-fetch-once/data/variant-map.json
      AMROD_PRICES_JSON: ${{ github.workspace }}/price-fetch-once/data/amrod-prices.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build SKU → variant map + download Amrod prices
        working-directory: price-fetch-once
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_API_VERSION: "2026-01"
          AMROD_USERNAME: ${{ secrets.AMROD_USERNAME }}
          AMROD_PASSWORD: ${{ secrets.AMROD_PASSWORD }}
          AMROD_CUSTOMER_CODE: ${{ secrets.AMROD_CUSTOMER_CODE }}
        run: |
          node prices-build-variant-map.js
          node download-amrod-prices.js

      - name: Archive products not reachable by Amrod bulk pricing
        working-directory: product-fetch-once
        run: node archive-unpriced-products.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-unpriced-logs
          path: product-fetch-once/logs/
          if-no-files-found: ignore
